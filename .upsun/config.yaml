applications:
    app:
        type: "nodejs:22"

        build:
            flavor: none

        relationships:
            postgresql:
                service: postgresql
                endpoint: app202610

        variables:
            env:
                NPM_CONFIG_UPDATE_NOTIFIER: false
                DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

        hooks:
            build: |
                set -eu
                npm ci
                npm run build
            deploy: |
                set -eu
                export DATABASE_URL="postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_PATH}"
                npx prisma migrate deploy
                npx tsx prisma/seed.ts

        web:
            commands:
                start: "export DATABASE_URL=\"postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_PATH}\" && npm run start -- -p $PORT"
            upstream:
                socket_family: tcp
            locations:
                "/":
                    passthru: true

services:
    postgresql:
        type: postgresql:16
        configuration:
            databases:
                - main
            endpoints:
                app202610:
                    default_database: main
                    privileges:
                        main: admin

routes:
    "https://{default}/":
        id: app
        type: upstream
        primary: true
        upstream: "app:http"
